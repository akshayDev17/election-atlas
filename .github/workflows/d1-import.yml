name: Import into D1

# The first import of the published atlas data into the election-atlas D1
# database, split over two UTC days to stay under the free plan's 100,000 rows
# written per day (backend/d1/ingest.py):
#
#   day 1  assembly results, councils of ministers, Lok Sabha by-elections
#   day 2  Lok Sabha general elections
#
# Applies outstanding migrations first, leaves out every document of the day that
# D1 already holds (so a re-run, or a file added later, imports only what is
# missing), validates every record (tools/validate_records.py) before any SQL
# exists, and prints D1's own rows-written count for the import.

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'Import day (1: assembly, cabinets, by-elections; 2: Lok Sabha)'
        required: true
        type: choice
        options: ['1', '2']
      years:
        description: 'Optional, comma-separated election years to import now (e.g. 2024,2014); empty = all of the day'
        required: false
        default: ''
      max_rows:
        description: 'Refuse the import if its estimated rows written exceed this (what is left of the 100,000 a day)'
        required: true
        default: '90000'

permissions:
  contents: read

concurrency:
  group: d1-write
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.151.1

jobs:
  import:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DAY: ${{ inputs.day }}
      YEARS: ${{ inputs.years }}
      MAX_ROWS: ${{ inputs.max_rows }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned atlas source
        id: src
        run: |
          echo "repo=$(jq -r .repository atlas-source.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit atlas-source.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.commit }}
          path: atlas-source
          # partial clone: only the blobs the sparse paths need are fetched
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /work/election-atlas/data/
            !/work/election-atlas/**/*.pdf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse to run before the database id is committed
        run: |
          if grep -q REPLACE_AFTER_d1_create wrangler.jsonc; then
            echo "::error::wrangler.jsonc still has the D1 placeholder; run portfolio-app bootstrap --public first."
            exit 1
          fi

      - name: Where the database lives
        run: $WRANGLER d1 info election-atlas

      - name: Apply migrations
        run: $WRANGLER d1 migrations apply election-atlas --remote

      - name: List the documents D1 already holds
        run: |
          $WRANGLER d1 execute election-atlas --remote --json \
            --command "SELECT path FROM document" > present.json
          jq -r '.[0].results[].path' present.json > present.txt
          echo "documents already in D1: $(wc -l < present.txt)"

      - name: Validate every record and write the SQL (documents not yet in D1)
        run: |
          set -o pipefail
          python3 d1/ingest.py --data ../atlas-source/work/election-atlas/data --day "$DAY" \
            ${YEARS:+--years "$YEARS"} --max-rows "$MAX_ROWS" \
            --skip-present present.txt --out "day$DAY.sql" | tee plan.txt
          if ! grep -q '^INSERT INTO document ' "day$DAY.sql"; then
            echo "nothing to import for day $DAY: every document is already in D1"
            echo "empty=1" >> "$GITHUB_ENV"
          fi

      - name: Import
        if: env.empty != '1'
        run: |
          $WRANGLER d1 execute election-atlas --remote --file "day$DAY.sql" --yes | tee import.log

      # One row of scalar subqueries: D1 refuses a compound SELECT of more than a
      # few UNION terms ("too many terms in compound SELECT").
      - name: What D1 now holds
        run: |
          $WRANGLER d1 execute election-atlas --remote --command "
            SELECT
              (SELECT count(*) FROM document) AS documents,
              (SELECT count(*) FROM source) AS sources,
              (SELECT count(*) FROM contest) AS contests,
              (SELECT count(*) FROM candidacy) AS candidacies,
              (SELECT count(*) FROM region_party_tally) AS region_party_tallies,
              (SELECT count(*) FROM minister_tenure) AS minister_tenures,
              (SELECT count(*) FROM term WHERE provenance <> 'published')
                + (SELECT count(*) FROM contest WHERE provenance <> 'published')
                + (SELECT count(*) FROM document WHERE provenance <> 'published') AS not_published"
