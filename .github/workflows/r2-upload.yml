name: Upload bill PDFs to R2

# Puts every state bill PDF listed in the bill manifests of the pinned github.io
# commit into the election-atlas-docs bucket, checking each file's sha256 against
# its manifest before the upload and again after reading it back from R2.
# Prints the counts, every mismatch, and the files over 25 MiB.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: r2-upload
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned atlas source
        id: src
        run: |
          echo "repo=$(jq -r .repository backend/atlas-source.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit backend/atlas-source.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.commit }}
          path: atlas-source
          # partial clone: only the blobs the sparse paths need are fetched
          filter: blob:none
          sparse-checkout: work/election-atlas/data/state-legislation
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Upload and verify
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 backend/r2_upload.py --atlas atlas-source/work/election-atlas
