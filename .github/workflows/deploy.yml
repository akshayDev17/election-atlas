name: Deploy

# Builds the Next.js frontend, exports the atlas's data files from D1, refuses to
# deploy unless they are what the pinned github.io commit committed and the
# provenance gate passes over both the export and D1 itself, then deploys the
# Worker. The atlas is served at /elections/india/; the bare /elections and
# /elections/ addresses and the old address /work/election-atlas/* answer 308 to
# it. The config carries no routes: the four live routes are attached outside it
# by portfolio-app.

on:
  workflow_dispatch:
    inputs:
      pending_ok:
        description: 'Deploy before every import day has run: list the data files D1 does not hold yet as pending (the pages show "not available yet") instead of failing'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  WRANGLER: npx --yes wrangler@4.151.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Read the pinned atlas source
        id: src
        run: |
          echo "repo=$(jq -r .repository backend/atlas-source.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit backend/atlas-source.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.commit }}
          path: atlas-source
          # partial clone: only the blobs the sparse paths need are fetched
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /work/election-atlas/data/
            !/work/election-atlas/**/*.pdf
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Refuse a Worker config with routes
        run: python3 backend/check_no_routes.py backend/wrangler.jsonc
      - name: Refuse to run before the database id is committed
        run: |
          if grep -q REPLACE_AFTER_d1_create backend/wrangler.jsonc; then
            echo "::error::backend/wrangler.jsonc still has the D1 placeholder"; exit 1
          fi

      - name: Export D1
        working-directory: backend
        run: |
          $WRANGLER d1 export election-atlas --remote --output ../d1.sql --skip-confirmation
          python3 -c "import sqlite3; c = sqlite3.connect('../d1.sqlite'); c.executescript(open('../d1.sql').read()); c.commit()"

      - name: Write the data files from D1 and diff them against the committed JSON
        run: |
          python3 backend/d1/export.py --db d1.sqlite --out exported \
            --compare atlas-source/work/election-atlas/data --overlay backend/d1/inputs

      - name: Build the frontend (Next.js static export, type-checked)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm run test:export

      - name: Assemble the site
        env:
          PENDING_OK: ${{ inputs.pending_ok && '--pending-ok' || '' }}
        run: |
          # shellcheck disable=SC2086
          python3 backend/build_site.py --out dist --data-from exported \
            --complete-against atlas-source/work/election-atlas/data $PENDING_OK

      - name: Provenance gate over the export and over D1
        run: python3 tools/check_provenance.py dist/elections/india/data --db d1.sqlite

      - name: Provenance gate, asked of D1 directly
        working-directory: backend
        run: |
          $WRANGLER d1 execute election-atlas --remote --json --command "
            SELECT
              (SELECT count(*) FROM term WHERE provenance <> 'published' OR source_id IS NULL)
            + (SELECT count(*) FROM document WHERE provenance <> 'published' OR source_id IS NULL)
            + (SELECT count(*) FROM region_tally WHERE provenance <> 'published' OR source_id IS NULL)
            + (SELECT count(*) FROM region_party_tally WHERE provenance <> 'published' OR source_id IS NULL)
            + (SELECT count(*) FROM contest WHERE provenance <> 'published' OR source_id IS NULL)
            + (SELECT count(*) FROM ministry WHERE provenance <> 'published' OR source_id IS NULL)
            + (SELECT count(*) FROM minister_tenure WHERE provenance <> 'published' OR source_id IS NULL)
              AS not_published" > ../d1-gate.json
          cat ../d1-gate.json
          test "$(jq '.[0].results[0].not_published' ../d1-gate.json)" = 0

      - name: Negative tests (the gate must fail on planted synthetic and dummy data)
        run: |
          python3 -m unittest discover -s backend/d1 -p 'test_*.py' -v
          python3 -m unittest discover -s tools -p 'test_check_provenance.py' -v

      # With every file present the committed index must already be right; with
      # files pending it is rebuilt for the site from the files it actually has.
      - name: availability.json matches the files present
        env:
          PENDING_OK: ${{ inputs.pending_ok }}
        run: |
          if [ "$PENDING_OK" = true ]; then
            python3 dist/elections/india/tools/build-availability.py
            jq -c .ls dist/elections/india/data/availability.json
          else
            python3 dist/elections/india/tools/build-availability.py --check
          fi

      - name: Static-asset limits (20,000 files, 25 MiB each)
        run: |
          n=$(find dist -type f | wc -l); big=$(find dist -type f -size +25M | wc -l)
          echo "assets: $n files, $big over 25 MiB"
          test "$n" -lt 20000 && test "$big" = 0

      - name: Deploy the Worker (no routes)
        working-directory: backend
        run: $WRANGLER deploy | tee ../deploy.log

      - name: Smoke test the preview
        run: |
          base=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "preview: $base/elections/india/"
          test -n "$base"
          echo "$base" > preview-base.txt
          # A new deploy can take a few seconds to answer on workers.dev: wait for the
          # atlas root (up to 2 minutes) before judging anything.
          for _ in $(seq 1 24); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' "$base/elections/india/")" = 200 ] && break
            sleep 5
          done
          for p in "" data/manifest.json data/availability.json data/results/ac/IN-UP/2022.json state/ mp/ mla/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/elections/india/$p")
            echo "$code /elections/india/$p"; test "$code" = 200
          done
          # the old address answers a permanent redirect to the same URL here, query kept
          want="$base/elections/india/state/?s=IN-UP&y=2024"
          got=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' "$base/work/election-atlas/state/?s=IN-UP&y=2024")
          echo "$got /work/election-atlas/state/?s=IN-UP&y=2024"; test "$got" = "308 $want"
          # every page passes through site-shell (the SHELL binding), and the picker
          # script it links at the shared /_site/ path answers on the site, where
          # akshayprabhakant.com/_site/* is routed to site-shell
          for p in "" state/ mp/ mla/; do
            shell=$(curl -s -D - -o page.html "$base/elections/india/$p" | tr -d '\r' | sed -n 's/^x-site-shell: //Ip')
            echo "x-site-shell: $shell /elections/india/$p"; test -n "$shell"
          done
          js=$(grep -oE '"/_site/[0-9a-f]{12}/site\.js"' page.html | tr -d '"' | head -1)
          code=$(curl -s -o /dev/null -w '%{http_code}' "https://akshayprabhakant.com$js")
          echo "$code $js"; test -n "$js" && test "$code" = 200

      - name: Provenance gate over what the preview serves
        run: python3 tools/check_provenance.py dist/elections/india/data --remote "$(cat preview-base.txt)/elections/india/"
