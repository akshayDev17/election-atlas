name: CI

# On every pull request and push: the provenance gate and its negative tests, the
# tool and Worker unit tests, the full JSON -> D1 -> JSON round trip in a local
# SQLite built from the migration, the Next.js frontend (type-checked build,
# library tests, export contract, and a browser smoke over the assembled site),
# and the Worker with the real site-shell in local workerd (contract and the
# browser smoke again, composed). No Cloudflare access.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The data JSON the import reads, from the pinned github.io commit
      # (backend/atlas-source.json). The bill PDFs are never downloaded.
      - name: Read the pinned atlas source
        id: src
        run: |
          echo "repo=$(jq -r .repository backend/atlas-source.json)" >> "$GITHUB_OUTPUT"
          echo "commit=$(jq -r .commit backend/atlas-source.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.src.outputs.repo }}
          ref: ${{ steps.src.outputs.commit }}
          path: atlas-source
          # partial clone: only the blobs the sparse paths need are fetched
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /work/election-atlas/data/
            !/work/election-atlas/**/*.pdf

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r requirements.txt

      - name: Refuse a Worker config with routes
        run: python3 backend/check_no_routes.py backend/wrangler.jsonc

      - name: D1 tests (schema CHECKs, ingest refusals, checker over D1, round trip)
        run: python3 -m unittest discover -s backend/d1 -p 'test_*.py' -v

      - name: Worker unit tests
        run: node --test backend/src/test_index.mjs

      - name: Frontend — install
        working-directory: frontend
        run: npm ci

      # `next build` type-checks (TypeScript strict) and writes the static export
      # to frontend/out, which build_site.py lays under dist/elections/india/.
      - name: Frontend — static export build
        working-directory: frontend
        run: npm run build

      - name: Frontend — export contract
        working-directory: frontend
        run: npm run test:export

      - name: Import the pinned data into a local D1 (SQLite) and export it back
        run: |
          python3 backend/d1/ingest.py --data atlas-source/work/election-atlas/data --day 1 --out day1.sql
          python3 backend/d1/ingest.py --data atlas-source/work/election-atlas/data --day 2 --out day2.sql
          python3 - <<'PY'
          import sqlite3
          con = sqlite3.connect('d1.sqlite')
          con.execute('PRAGMA foreign_keys = ON')
          import glob
          for m in sorted(glob.glob('backend/migrations/*.sql')):
              con.executescript(open(m).read())
          for day in ('day1.sql', 'day2.sql'):
              con.executescript('BEGIN;' + open(day).read() + 'COMMIT;')
          bad = con.execute('PRAGMA foreign_key_check').fetchall()
          assert not bad, bad
          PY
          python3 backend/d1/export.py --db d1.sqlite --out exported --compare atlas-source/work/election-atlas/data \
            --overlay backend/d1/inputs

      # The data files are build artifacts here: materialize them from the export
      # so the tools that read data/results and data/cabinet can be tested.
      - name: Assemble the site and run the provenance gate over it and the local D1
        run: |
          python3 backend/build_site.py --out dist --data-from exported --complete-against atlas-source/work/election-atlas/data
          python3 tools/check_provenance.py dist/elections/india/data --db d1.sqlite
          python3 dist/elections/india/tools/build-availability.py --check

      - name: Tool tests, with the exported data in place
        run: |
          cp -R exported/. data/
          python3 -m unittest discover -s tools -p 'test_*.py' -v

      # The data adapters (tenses, by-election resolution, not-available-yet
      # rules), against the exported data copied into data/ above.
      - name: Frontend — library tests
        working-directory: frontend
        run: npm run test:lib

      # National, state, MP and MLA pages in Chrome over the assembled site: each
      # must draw with zero console errors and no failed request.
      - name: Frontend — browser smoke
        working-directory: frontend
        env:
          SMOKE_DIST: ${{ github.workspace }}/dist
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:smoke

      # The Worker against the real site-shell, in local workerd (no account),
      # over the assembled site in dist/: every page composed byte for byte, the
      # fail-open cases (unbound, site-shell not running, site-shell throwing),
      # then the browser smoke again through the Worker, so each page draws and
      # hydrates with site-shell's head block in it. site-themes is public, and
      # its main branch is what deploys site-shell.
      - uses: actions/checkout@v4
        with:
          repository: akshayDev17/site-themes
          ref: main
          path: site-themes

      - name: Frontend — site-shell contract
        working-directory: frontend
        env:
          SITE_THEMES_DIR: ${{ github.workspace }}/site-themes
        run: npm run test:shell

      - name: Frontend — browser smoke through the Worker and site-shell
        working-directory: frontend
        env:
          SITE_THEMES_DIR: ${{ github.workspace }}/site-themes
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run test:smoke
